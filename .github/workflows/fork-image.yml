name: fork-image

# 个人 fork 用：把当前分支构建成 linux/amd64 + linux/arm64 镜像推到本人 GHCR。
# 不碰上游的 release.yml；上游合并补丁后删掉本文件即可。
on:
  push:
    branches: [fix/ws-liveness-on-message]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/fast-note-sync-service
  PATCH_TAG: 3.6.1-liveness.1

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Makefile 用 git describe 取版本号

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install gox
        run: go install github.com/mitchellh/gox@latest

      - name: Cross-compile (same target as upstream)
        run: make gox-all

      - name: Sanity check binaries
        run: ls -l build/linux_amd64 build/linux_arm64

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.PATCH_TAG }}
            ${{ env.IMAGE }}:liveness
          build-args: |
            VERSION=${{ env.PATCH_TAG }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_COMMIT=${{ github.sha }}
